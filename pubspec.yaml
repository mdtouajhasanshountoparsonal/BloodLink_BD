name: bloodlink_bd
description: "BloodLink BD — real-time emergency blood coordination platform."
publish_to: 'none'
version: 0.1.1+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  geolocator: 14.0.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/icon_app.png"
  adaptive_icon_background: "#0A0E14"
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter:
  uses-material-design: true